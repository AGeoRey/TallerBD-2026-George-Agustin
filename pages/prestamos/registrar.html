<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Préstamo | Control de Préstamos</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>
<body class="admin-layout">
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Inventario</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="../inicio.html">Inicio</a></li>
                <li><a href="../equipos/equipos.html">Equipos</a></li>
                <li><a href="../solicitantes/solicitantes.html">Solicitantes</a></li>
                <li><a href="prestamos.html" class="active">Préstamos</a></li>
                <li><a href="../mantenimiento/mantenimiento.html">Mantenimiento</a></li>
                <li><a href="../consultas/disponibilidad.html">Disponibilidad</a></li>
                <li><a href="../consultas/historial.html">Historial</a></li>
                <li><a href="../catalogos/catalogos.html">Catálogos</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰ Menú</button>
            <div class="user-info">
                <span>Usuario Administrador</span>
                <a href="../login.html" class="btn-logout">Cerrar sesión</a>
            </div>
        </header>

        <section class="content">
            <h1>Registro de Préstamo</h1>
            
            <div class="panel form-panel">
                <form action="prestamos.html" method="GET">
                    
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="id_inventario">Equipo a Prestar</label>
                            <select id="id_inventario" name="id_inventario" required>
                                <option value="">Seleccione un equipo disponible...</option>
                                <!-- Opciones cargadas dinámicamente -->
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label for="id_solicitante">Solicitante</label>
                            <select id="id_solicitante" name="id_solicitante" required>
                                <option value="">Seleccione al personal institucional...</option>
                                <!-- Opciones cargadas dinámicamente -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha_prestamo">Fecha de Préstamo</label>
                            <input type="datetime-local" id="fecha_prestamo" name="fecha_prestamo" required>
                        </div>

                        <div class="form-group">
                            <label for="fecha_prevista_devolucion">Devolución Prevista</label>
                            <input type="datetime-local" id="fecha_prevista_devolucion" name="fecha_prevista_devolucion" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="usuario_entrega">Registrado por</label>
                            <input type="text" id="usuario_entrega" value="Usuario Administrador" disabled>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="prestamos.html" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary">Confirmar Entrega</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="../../js/app.js"></script>
</body>
</html>
