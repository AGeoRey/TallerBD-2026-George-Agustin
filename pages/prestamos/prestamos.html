<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos | Control de Equipo</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>
<body class="admin-layout">
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Inventario</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="../inicio.html">Inicio</a></li>
                <li><a href="../equipos/equipos.html">Equipos</a></li>
                <li><a href="../solicitantes/solicitantes.html">Solicitantes</a></li>
                <li><a href="prestamos.html" class="active">Préstamos</a></li>
                <li><a href="../mantenimiento/mantenimiento.html">Mantenimiento</a></li>
                <li><a href="../consultas/disponibilidad.html">Disponibilidad</a></li>
                <li><a href="../consultas/historial.html">Historial</a></li>
                <li><a href="../catalogos/catalogos.html">Catálogos</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰ Menú</button>
            <div class="user-info">
                <span>Usuario Administrador</span>
                <a href="../login.html" class="btn-logout">Cerrar sesión</a>
            </div>
        </header>

        <section class="content">
            <h1>Préstamos Activos</h1>
            
            <div class="panel">
                <div class="toolbar">
                    <div class="filters">
                        <input type="text" placeholder="Equipo o solicitante..." class="input-search">
                        <select class="select-filter">
                            <option value="">Todos los estados</option>
                            <option value="Vigente">Vigente</option>
                            <option value="Vencido">Vencido</option>
                        </select>
                    </div>
                    <a href="registrar.html" class="btn-primary btn-add">+ Registrar Préstamo</a>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Folio</th>
                                <th>Equipo</th>
                                <th>Solicitante</th>
                                <th>Entregado por</th>
                                <th>Fecha Préstamo</th>
                                <th>Devolución Prevista</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los registros se cargarán dinámicamente con PHP -->
                            <!-- En "Acciones" habrá un botón para redirigir a devolucion.html con el ID del préstamo -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="../../js/app.js"></script>
</body>
</html>
