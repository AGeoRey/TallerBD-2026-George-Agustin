<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Equipo | Control de Préstamos</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>
<body class="admin-layout">
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Inventario</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="../inicio.html">Inicio</a></li>
                <li><a href="equipos.html" class="active">Equipos</a></li>
                <li><a href="../solicitantes/solicitantes.html">Solicitantes</a></li>
                <li><a href="../prestamos/prestamos.html">Préstamos</a></li>
                <li><a href="../mantenimiento/mantenimiento.html">Mantenimiento</a></li>
                <li><a href="../consultas/disponibilidad.html">Disponibilidad</a></li>
                <li><a href="../consultas/historial.html">Historial</a></li>
                <li><a href="../catalogos/catalogos.html">Catálogos</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰ Menú</button>
            <div class="user-info">
                <span>Usuario Administrador</span>
                <a href="../login.html" class="btn-logout">Cerrar sesión</a>
            </div>
        </header>

        <section class="content">
            <h1>Datos del Equipo</h1>
            
            <div class="panel form-panel">
                <form action="equipos.html" method="GET">
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="id_inventario">Identificación (ID Inventario)</label>
                            <input type="text" id="id_inventario" name="id_inventario" required>
                        </div>

                        <div class="form-group">
                            <label for="id_categoria">Categoría</label>
                            <select id="id_categoria" name="id_categoria" required>
                                <option value="">Seleccione una categoría...</option>
                                <!-- Opciones cargadas desde la tabla categorias -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="id_marca">Marca</label>
                            <select id="id_marca" name="id_marca" required>
                                <option value="">Seleccione una marca...</option>
                                <!-- Opciones cargadas desde la tabla marcas -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="condicion_actual">Condición</label>
                            <select id="condicion_actual" name="condicion_actual" required>
                                <option value="Disponible">Disponible</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="descripcion">Descripción del equipo</label>
                        <textarea id="descripcion" name="descripcion" rows="3" required></textarea>
                    </div>

                    <div class="form-actions">
                        <a href="equipos.html" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="../../js/app.js"></script>
</body>
</html>
