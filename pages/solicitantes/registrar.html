<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Solicitante | Control de Préstamos</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>
<body class="admin-layout">
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Inventario</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="../inicio.html">Inicio</a></li>
                <li><a href="../equipos/equipos.html">Equipos</a></li>
                <li><a href="solicitantes.html" class="active">Solicitantes</a></li>
                <li><a href="../prestamos/prestamos.html">Préstamos</a></li>
                <li><a href="../mantenimiento/mantenimiento.html">Mantenimiento</a></li>
                <li><a href="../consultas/disponibilidad.html">Disponibilidad</a></li>
                <li><a href="../consultas/historial.html">Historial</a></li>
                <li><a href="../catalogos/catalogos.html">Catálogos</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰ Menú</button>
            <div class="user-info">
                <span>Usuario Administrador</span>
                <a href="../login.html" class="btn-logout">Cerrar sesión</a>
            </div>
        </header>

        <section class="content">
            <h1>Datos del Solicitante</h1>
            
            <div class="panel form-panel">
                <form action="solicitantes.html" method="GET">
                    
                    <div class="form-group full-width">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="numero_institucional">Número Institucional</label>
                            <input type="text" id="numero_institucional" name="numero_institucional" required>
                        </div>

                        <div class="form-group">
                            <label for="id_departamento">Departamento</label>
                            <select id="id_departamento" name="id_departamento" required>
                                <option value="">Seleccione un departamento...</option>
                                <!-- Opciones cargadas desde la tabla departamentos -->
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="solicitantes.html" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="../../js/app.js"></script>
</body>
</html>
